      - text: Tools
        menu:
          - href: tools/index.qmd
            text: All tools
          - href: tools/pathways/index.qmd
            text: Longitudinal Pathway Dynamics
          - href: tools/context/index.qmd
            text: School Context & Transition Explorer
          - href: tools/entry-space/index.qmd
            text: University Entry Space Explorer
          - href: tools/compensatory/index.qmd
            text: Compensatory Advantage Explorer
          - href: tools/trajectories/index.qmd
            text: University Trajectory Lab
      - href: cv.qmd
        text: CV

    right:
      - text: "EN · CA · ES"
        aria-label: "Select language / Selecciona l’idioma"
        menu:
          - text: "English"
