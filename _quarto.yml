    - "tools/**/*.qmd"
    - "dissecting/**/*.qmd"
    - "ca/*.qmd"
    - "es/*.qmd"
    - "ca/news/**/*.qmd"
    - "es/news/**/*.qmd"
    - "ca/tools/**/*.qmd"
    - "ca/dissecting/**/*.qmd"
    - "es/tools/**/*.qmd"
    - "es/dissecting/**/*.qmd"

  resources:
    - "dissecting/university-trajectories/index.html"
    - "ca/dissecting/university-trajectories/index.html"
    - "es/dissecting/university-trajectories/index.html"
    - "dissecting/gender-stem/index.html"
    - "ca/dissecting/gender-stem/index.html"
    - "es/dissecting/gender-stem/index.html"

website:
  title: "Albert Sánchez-Gelabert"
  site-url: "https://albert-sanchez-gelabert.github.io/"
  description: "Sociologist and researcher studying higher education, educational inequalities, student trajectories and STEM participation."

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: news.qmd
        text: News
      - text: Explore
        menu:
          - href: tools/index.qmd
            text: Research Tools
          - href: tools/educational-inequality-lab/index.qmd
            text: Educational Inequality Lab
          - href: dissecting/index.qmd
            text: Dissecting a Study
      - href: cv.qmd
        text: CV

    right:
      - text: "EN · CA · ES"
        aria-label: "Select language / Selecciona l’idioma"
        menu:
          - text: "English"
            href: index.qmd
          - text: "Català"
            href: ca/index.qmd
          - text: "Castellano"
            href: es/index.qmd

  search: true

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header: _includes/multilingual-nav.html

