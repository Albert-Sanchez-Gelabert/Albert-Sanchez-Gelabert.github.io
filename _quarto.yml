    - "*.qmd"
    - "news/**/*.qmd"
    - "tools/**/*.qmd"
    - "ca/*.qmd"
    - "es/*.qmd"
    - "ca/news/**/*.qmd"
    - "es/news/**/*.qmd"
    - "ca/tools/**/*.qmd"
    - "es/tools/**/*.qmd"

website:
  title: "Albert Sánchez-Gelabert"
  site-url: "https://albert-sanchez-gelabert.github.io/"
